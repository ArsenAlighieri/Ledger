{{define "step_content"}}
<div>
  <h2 class="text-xl font-bold text-white mb-2">Acil Durum Fonu Kaynağı</h2>
  <p class="text-sm text-slate-400 mb-6">Acil durum fonunu hangi varlığın veya hesabın temsil ediyor? Ledger ilerleme çubuğunu bu varlığa göre takip eder.</p>

  <form action="/setup/next" method="POST" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="step" value="10">

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Fon Kaynağı Seç</label>
      <select name="emergency_fund_binding" class="w-full rounded-xl border border-dark-border bg-dark-input px-4 py-3 text-white focus:border-emerald-500 focus:outline-none text-sm">
        <option value="general">Genel Nakit & Banka Bakiyeleri</option>
        
        {{if .Accounts}}
        <optgroup label="Banka Hesapları">
          {{range .Accounts}}
          <option value="account:{{.ID}}">{{.Name}} ({{.Balance}} {{.Currency}})</option>
          {{end}}
        </optgroup>
        {{end}}

        {{if .Positions}}
        <optgroup label="Yatırımlar & Fonlar (Örn: TP2)">
          {{range .Positions}}
          <option value="position:{{.ID}}">{{.Instrument.Symbol}} - {{.Instrument.Name}}</option>
          {{end}}
        </optgroup>
        {{end}}
      </select>
      <span class="text-xs text-slate-500 mt-2 block">Örnek: TP2 Para Piyasası Fonu veya Ziraat Vadeli Hesap.</span>
    </div>

    <div class="flex items-center justify-between pt-6 border-t border-dark-border mt-6">
      <a href="/setup?step=9" class="text-xs font-medium text-slate-400 hover:text-white px-3 py-2">← Geri</a>
      <div class="flex items-center gap-3">
        <button type="submit" name="action" value="skip" class="text-xs font-medium text-slate-400 hover:text-white px-3 py-2">Şimdilik Geç</button>
        <button type="submit" name="action" value="save" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-6 py-2.5 rounded-xl transition shadow-md active:scale-95">Devam Et →</button>
      </div>
    </div>
  </form>
</div>
{{end}}
