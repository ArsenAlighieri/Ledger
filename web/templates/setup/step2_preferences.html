{{define "step_content"}}
<div>
  <h2 class="text-xl font-bold text-white mb-2">Temel Tercihler</h2>
  <p class="text-sm text-slate-400 mb-6">Hesaplamalarda kullanılacak ana para birimi ve hedeflerini belirle.</p>

  <form action="/setup/next" method="POST" class="space-y-5">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="step" value="2">

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Adın / Hitap</label>
      <input type="text" name="name" value="{{.Settings.BaseCurrency}}" placeholder="Kişisel Kullanıcı"
             class="w-full rounded-xl border border-dark-border bg-dark-input px-4 py-3 text-white placeholder-slate-500 focus:border-emerald-500 focus:outline-none text-sm">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Ana Para Birimi</label>
      <select name="base_currency"
              class="w-full rounded-xl border border-dark-border bg-dark-input px-4 py-3 text-white focus:border-emerald-500 focus:outline-none text-sm">
        <option value="TRY" selected>TRY — Türk Lirası (₺)</option>
        <option value="USD">USD — Amerikan Doları ($)</option>
        <option value="EUR">EUR — Euro (€)</option>
      </select>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Acil Durum Fonu Hedefi (TL)</label>
      <input type="number" name="emergency_target" value="50000" step="1000" min="0" required
             class="w-full rounded-xl border border-dark-border bg-dark-input px-4 py-3 text-white placeholder-slate-500 focus:border-emerald-500 focus:outline-none text-sm">
      <span class="text-xs text-slate-500 mt-1 block">Önerilen: 3-6 aylık temel gider tutarı (Varsayılan 50.000 TL).</span>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Aylık Yatırım Hedefi (TL) <span class="text-slate-500 normal-case">(İsteğe Bağlı)</span></label>
      <input type="number" name="monthly_investment_target" value="0" step="500" min="0"
             class="w-full rounded-xl border border-dark-border bg-dark-input px-4 py-3 text-white placeholder-slate-500 focus:border-emerald-500 focus:outline-none text-sm">
    </div>

    <div class="flex items-center justify-between pt-6 border-t border-dark-border mt-6">
      <a href="/setup?step=1" class="text-xs font-medium text-slate-400 hover:text-white px-3 py-2">← Geri</a>
      <div class="flex items-center gap-3">
        <button type="submit" name="action" value="skip" class="text-xs font-medium text-slate-400 hover:text-white px-3 py-2">Şimdilik Geç</button>
        <button type="submit" name="action" value="save" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-6 py-2.5 rounded-xl transition shadow-md active:scale-95">Devam Et →</button>
      </div>
    </div>
  </form>
</div>
{{end}}
