{{define "step_content"}}
<div class="text-center py-4">
  <div class="w-16 h-16 rounded-2xl bg-emerald-600/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 mx-auto mb-6">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
    </svg>
  </div>

  <h1 class="text-2xl sm:text-3xl font-bold text-white mb-4">Ledger'a Hoş Geldin</h1>
  
  <p class="text-slate-300 text-sm sm:text-base leading-relaxed max-w-md mx-auto mb-8">
    Finansal durumunu birkaç adımda oluşturalım. Bir kez girdikten sonra düzenli gelir ve giderlerini tekrar tekrar yazmak zorunda kalmayacaksın.
  </p>

  <form action="/setup/next" method="POST">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="step" value="1">

    <button type="submit"
            class="w-full sm:w-auto px-8 py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl transition shadow-lg shadow-emerald-950 active:scale-95 text-base tracking-wide">
      BAŞLA →
    </button>
  </form>
</div>
{{end}}
