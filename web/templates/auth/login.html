{{define "content"}}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full space-y-8 bg-dark-card border border-dark-border p-8 rounded-2xl shadow-xl">
    <div class="text-center">
      <div class="w-12 h-12 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-black text-2xl mx-auto mb-4 shadow-lg shadow-emerald-950">
        L
      </div>
      <h2 class="text-2xl font-bold tracking-tight text-white">Ledger Girişi</h2>
      <p class="mt-2 text-sm text-slate-400">Kişisel finans kokpitine erişmek için şifreni gir.</p>
    </div>

    {{if .Error}}
    <div class="bg-red-950/50 border border-red-800/80 text-red-200 text-sm px-4 py-3 rounded-xl flex items-center gap-3">
      <svg class="w-5 h-5 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
      </svg>
      <span>{{.Error}}</span>
    </div>
    {{end}}

    <form class="mt-8 space-y-6" action="/login" method="POST">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      
      <div class="space-y-4">
        <div>
          <label for="username" class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">Kullanıcı Adı</label>
          <input id="username" name="username" type="text" required autofocus
                 class="block w-full rounded-xl border border-dark-border bg-dark-input px-4 py-3 text-white placeholder-slate-500 focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500 text-sm">
        </div>

        <div>
          <label for="password" class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">Şifre</label>
          <input id="password" name="password" type="password" required
                 class="block w-full rounded-xl border border-dark-border bg-dark-input px-4 py-3 text-white placeholder-slate-500 focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500 text-sm">
        </div>
      </div>

      <button type="submit"
              class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500">
        Giriş Yap
      </button>
    </form>
  </div>
</div>
{{end}}
