{{define "nav"}}
<!-- Desktop Header Nav -->
<header class="border-b border-dark-border bg-dark-bg/80 backdrop-blur sticky top-0 z-30">
  <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <a href="/dashboard" class="flex items-center gap-2 text-lg font-bold tracking-wider text-white">
        <div class="w-7 h-7 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-extrabold text-sm">
          L
        </div>
        <span>LEDGER</span>
      </a>

      <!-- Desktop Nav Links -->
      <nav class="hidden md:flex items-center gap-1">
        <a href="/dashboard" class="px-3 py-1.5 rounded-lg text-sm font-medium transition {{if eq .ActiveNav "dashboard"}}bg-dark-card text-emerald-400 border border-dark-border{{else}}text-slate-400 hover:text-white hover:bg-dark-hover{{end}}">
          Genel Bakış
        </a>
        <a href="/transactions" class="px-3 py-1.5 rounded-lg text-sm font-medium transition {{if eq .ActiveNav "transactions"}}bg-dark-card text-emerald-400 border border-dark-border{{else}}text-slate-400 hover:text-white hover:bg-dark-hover{{end}}">
          İşlemler
        </a>
        <a href="/recurring" class="px-3 py-1.5 rounded-lg text-sm font-medium transition {{if eq .ActiveNav "recurring"}}bg-dark-card text-emerald-400 border border-dark-border{{else}}text-slate-400 hover:text-white hover:bg-dark-hover{{end}}">
          Düzenli
        </a>
        <a href="/assets" class="px-3 py-1.5 rounded-lg text-sm font-medium transition {{if eq .ActiveNav "assets"}}bg-dark-card text-emerald-400 border border-dark-border{{else}}text-slate-400 hover:text-white hover:bg-dark-hover{{end}}">
          Varlıklar
        </a>
        <a href="/settings" class="px-3 py-1.5 rounded-lg text-sm font-medium transition {{if eq .ActiveNav "settings"}}bg-dark-card text-emerald-400 border border-dark-border{{else}}text-slate-400 hover:text-white hover:bg-dark-hover{{end}}">
          Ayarlar
        </a>
      </nav>
    </div>

    <!-- Quick Action + User Menu -->
    <div class="flex items-center gap-3">
      <button hx-get="/transactions/new" hx-target="#modal-container" hx-swap="innerHTML"
              class="hidden sm:inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition shadow-sm active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        <span>+ İŞLEM</span>
      </button>

      <a href="/logout" title="Çıkış Yap" class="text-slate-400 hover:text-red-400 p-2 rounded-lg hover:bg-dark-hover transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
      </a>
    </div>
  </div>
</header>

<!-- Mobile Bottom Navigation Bar -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-dark-bg/95 border-t border-dark-border backdrop-blur px-2 py-1.5 flex items-center justify-around">
  <a href="/dashboard" class="flex flex-col items-center gap-1 p-2 rounded-lg text-xs font-medium {{if eq .ActiveNav "dashboard"}}text-emerald-400{{else}}text-slate-400 hover:text-white{{end}}">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
    </svg>
    <span>Genel Bakış</span>
  </a>

  <a href="/transactions" class="flex flex-col items-center gap-1 p-2 rounded-lg text-xs font-medium {{if eq .ActiveNav "transactions"}}text-emerald-400{{else}}text-slate-400 hover:text-white{{end}}">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
    </svg>
    <span>İşlemler</span>
  </a>

  <a href="/recurring" class="flex flex-col items-center gap-1 p-2 rounded-lg text-xs font-medium {{if eq .ActiveNav "recurring"}}text-emerald-400{{else}}text-slate-400 hover:text-white{{end}}">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
    </svg>
    <span>Düzenli</span>
  </a>

  <a href="/assets" class="flex flex-col items-center gap-1 p-2 rounded-lg text-xs font-medium {{if eq .ActiveNav "assets"}}text-emerald-400{{else}}text-slate-400 hover:text-white{{end}}">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <span>Varlıklar</span>
  </a>

  <a href="/settings" class="flex flex-col items-center gap-1 p-2 rounded-lg text-xs font-medium {{if eq .ActiveNav "settings"}}text-emerald-400{{else}}text-slate-400 hover:text-white{{end}}">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
    </svg>
    <span>Ayarlar</span>
  </a>
</nav>
{{end}}

{{define "nav.html"}}
{{template "nav" .}}
{{end}}
