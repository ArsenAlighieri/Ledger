<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in" onclick="if(event.target === this) closeModal()">
  <div class="bg-dark-card border border-dark-border w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-5" onclick="event.stopPropagation()">
    
    <div class="flex items-center justify-between">
      <h3 class="text-lg font-bold text-white tracking-wide">Yeni İşlem Kaydı</h3>
      <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <form action="/transactions/create" method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

      <!-- Fast Toggle: Gider / Gelir -->
      <div class="grid grid-cols-2 gap-2 p-1 bg-dark-bg border border-dark-border rounded-xl">
        <label class="cursor-pointer">
          <input type="radio" name="type" value="expense" checked class="peer sr-only">
          <div class="py-2.5 text-center text-xs font-bold rounded-lg transition peer-checked:bg-red-600 peer-checked:text-white text-slate-400">
            GİDER (-)
          </div>
        </label>
        <label class="cursor-pointer">
          <input type="radio" name="type" value="income" class="peer sr-only">
          <div class="py-2.5 text-center text-xs font-bold rounded-lg transition peer-checked:bg-emerald-600 peer-checked:text-white text-slate-400">
            GELİR (+)
          </div>
        </label>
      </div>

      <!-- Amount Input (Large & Focused for Speed) -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Tutar (TL)</label>
        <div class="relative">
          <input type="number" name="amount" step="any" placeholder="0,00" required autofocus
                 class="w-full text-2xl font-bold rounded-xl border border-dark-border bg-dark-input px-4 py-3 text-white placeholder-slate-600 focus:border-emerald-500 focus:outline-none">
          <span class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-bold text-slate-500">TL</span>
        </div>
      </div>

      <!-- Category Select -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Kategori</label>
        <select name="category_id" required class="w-full rounded-xl border border-dark-border bg-dark-input px-3.5 py-3 text-white focus:border-emerald-500 focus:outline-none text-sm">
          <optgroup label="Gider Kategorileri">
            {{range .ExpenseCategories}}
            <option value="{{.ID}}">{{.Name}}</option>
            {{end}}
          </optgroup>
          <optgroup label="Gelir Kategorileri">
            {{range .IncomeCategories}}
            <option value="{{.ID}}">{{.Name}}</option>
            {{end}}
          </optgroup>
        </select>
      </div>

      <!-- Expandable "Detay Ekle" -->
      <details class="group border border-dark-border rounded-xl p-3 text-xs bg-dark-bg/40">
        <summary class="cursor-pointer text-slate-400 hover:text-white font-medium list-none flex items-center justify-between">
          <span>+ Detay Ekle (Tarih, Açıklama, Hesap)</span>
          <span class="text-slate-500 group-open:rotate-180 transition-transform">▼</span>
        </summary>
        <div class="mt-3 space-y-3 pt-2 border-t border-dark-border">
          <div>
            <label class="block text-slate-400 mb-1">Tarih</label>
            <input type="date" name="date" value="{{.TodayDate}}" class="w-full rounded-lg border border-dark-border bg-dark-input px-3 py-2 text-white text-xs">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Açıklama</label>
            <input type="text" name="description" placeholder="Örn: Market alışverişi" class="w-full rounded-lg border border-dark-border bg-dark-input px-3 py-2 text-white text-xs">
          </div>
          {{if .Accounts}}
          <div>
            <label class="block text-slate-400 mb-1">Hesap</label>
            <select name="account_id" class="w-full rounded-lg border border-dark-border bg-dark-input px-3 py-2 text-white text-xs">
              <option value="">Hesap Seçilmedi</option>
              {{range .Accounts}}
              <option value="{{.ID}}">{{.Name}} ({{.Balance}} {{.Currency}})</option>
              {{end}}
            </select>
          </div>
          {{end}}
        </div>
      </details>

      <button type="submit"
              class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-950 active:scale-[0.98] transition text-sm tracking-wide">
        KAYDET (5 sn)
      </button>
    </form>

  </div>
</div>
